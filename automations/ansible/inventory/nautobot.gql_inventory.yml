# Devices come from Nautobot. NAUTOBOT_URL and NAUTOBOT_TOKEN are read from the
# environment of the worker.
plugin: networktocode.nautobot.gql_inventory
validate_certs: false
query:
  devices:
    _custom_field_data:
    location: name
    role: name
    platform:
      name:
      napalm_driver:
      network_driver:
group_by:
  - location.name
  - role.name
  - platform.network_driver
