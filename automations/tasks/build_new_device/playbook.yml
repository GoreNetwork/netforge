---
# Each build step is a shared role in automations/ansible/roles. Later steps go
# after the reservation and can use `reservation.prefix`.
- name: Build new device
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Reserve a subnet for the device
      ansible.builtin.include_role:
        name: nautobot_reserve_prefix
      vars:
        reserve_label: "{{ device_name }}"
        reserve_prefix_length: "{{ prefix_length }}"

    - name: Write the task result
      ansible.builtin.copy:
        dest: "{{ lookup('ansible.builtin.env', 'NETFORGE_OUTPUT_FILE') }}"
        mode: "0600"
        content: >-
          {{ {'device_name': device_name,
              'prefix': reservation.prefix,
              'nautobot_id': reservation.id,
              'already_reserved': reservation_existed | bool} | to_json }}
