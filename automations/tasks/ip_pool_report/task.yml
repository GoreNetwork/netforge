title: IP pool report
description: Lists every subnet reserved from an IP pool. Read-only.
engine: python
entrypoint: report.py
timeout_seconds: 120
variables:
  - name: pool
    label: Pool
    required: false
    default: 10.0.0.0/16
    pattern: "\\d{1,3}(\\.\\d{1,3}){3}/\\d{1,2}"
    pattern_error: must be a prefix such as 10.0.0.0/16
    help: The parent prefix to report on.
